<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>實驗室 · 打卡模板</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4C8B67">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F7F0; --surface:#FFFFFF; --surface-soft:#EAF4E8;
    --ink:#243228; --ink-soft:#6E8577;
    --primary:#4C8B67; --primary-deep:#33624A; --primary-tint:#DCEEDD;
    --accent:#B98A5E; --success:#3E7A54; --success-tint:#DEF0E1;
    --border:#D9E8D7; --shadow:0 8px 24px rgba(36,50,40,.08);
    --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
    --font-display:'Noto Serif SC','Songti SC','SimSun',serif;
    --font-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    --quad-1:#6FA37C; --quad-2:#8CB26E; --quad-3:#4F8F6D; --quad-4:#5B9E86;
  }
  *{box-sizing:border-box;}
  html, body{height:100%; margin:0; overflow:hidden;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased;}

  .app{display:flex; height:100vh; overflow:hidden;}

  .top-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .rail-toggle{border:none; background:var(--surface-soft); border-radius:10px; width:34px; height:34px; font-size:16px; color:var(--ink); cursor:pointer; flex-shrink:0;}

  .sidebar-backdrop{position:fixed; inset:0; background:rgba(20,25,20,.4); z-index:48; opacity:0; pointer-events:none; transition:opacity .25s ease;}
  .sidebar-backdrop.show{opacity:1; pointer-events:auto;}
  .sidebar-drawer{position:fixed; top:0; left:0; height:100vh; width:190px; background:var(--surface); border-right:1px solid var(--border); z-index:50; padding:14px 10px; display:flex; flex-direction:column; gap:2px; box-shadow:var(--shadow); transform:translateX(-100%); transition:transform .25s ease;}
  .sidebar-drawer.show{transform:translateX(0);}
  .drawer-head{display:flex; justify-content:space-between; align-items:center; padding:0 6px 12px;}
  .drawer-head span{font-family:var(--font-display); font-weight:700; font-size:15px;}
  .drawer-head button{border:none; background:none; font-size:18px; color:var(--ink-soft); cursor:pointer;}
  .side-item{border:none; background:none; cursor:pointer; color:var(--ink-soft); border-radius:10px; padding:11px 12px; width:100%; text-align:left; font-size:13.5px; font-family:var(--font-body);}
  .side-item.active{background:var(--primary-tint); color:var(--primary-deep); font-weight:700;}

  main.main-area{flex:1; height:100vh; overflow-y:auto; overflow-x:hidden; padding:14px 16px 26px;}
  .page-brand{font-family:var(--font-display); font-weight:700; font-size:14px; color:var(--ink-soft);}
  .view{display:none; max-width:520px; margin:0 auto;}
  .view.active{display:block;}

  .empty-state{background:var(--surface); border-radius:var(--radius-lg); padding:30px 20px; text-align:center; box-shadow:var(--shadow); margin-top:14px;}
  .empty-state p{color:var(--ink-soft); font-size:13.5px; line-height:1.7; margin:8px 0 16px;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; font-family:var(--font-body); font-size:14px; font-weight:500; cursor:pointer; border:none; border-radius:999px; padding:11px 20px; color:#fff; background:var(--primary); transition:transform .12s ease;}
  .btn:active{transform:scale(.96);}
  .btn.secondary{background:var(--surface-soft); color:var(--ink); border:1px solid var(--border);}
  .btn.danger{background:transparent; color:var(--accent); border:1px solid var(--accent); padding:7px 14px; font-size:12.5px;}
  .btn.ghost{background:transparent; color:var(--primary); border:1px solid var(--primary); padding:7px 14px; font-size:12.5px;}
  .btn.block{width:100%;}
  .btn.small{padding:7px 12px; font-size:12.5px;}

  .routine-intro{font-size:12px; color:var(--ink-soft); margin:2px 4px 10px; line-height:1.6;}
  .routine-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin:0 4px;}
  .routine-card{border-radius:15px; padding:9px; color:#fff; display:flex; flex-direction:column; min-height:128px; min-width:0; box-shadow:var(--shadow);}
  .rc-name{width:100%; background:rgba(255,255,255,.18); border:none; border-radius:7px; color:#fff; font-weight:700; font-size:12px; font-family:var(--font-body); padding:5px 7px; margin-bottom:2px;}
  .rc-name::placeholder{color:rgba(255,255,255,.75);}
  .rc-time{width:100%; background:transparent; border:none; color:rgba(255,255,255,.85); font-size:9.5px; font-family:var(--font-body); padding:1px 7px 4px;}
  .rc-time::placeholder{color:rgba(255,255,255,.55);}
  .rc-head-row{display:flex; justify-content:space-between; align-items:flex-start; gap:5px;}
  .rc-head-row > div{min-width:0;}
  .rc-badge{background:rgba(255,255,255,.28); border-radius:999px; padding:2px 7px; font-size:10px; font-weight:700; margin-top:4px; flex-shrink:0;}
  .rc-items{display:flex; flex-direction:column; gap:4px; flex:1; overflow-y:auto; margin-top:4px;}
  .rc-item{display:flex; align-items:center; gap:5px; font-size:11px;}
  .rc-item input[type="checkbox"]{
    appearance:none; -webkit-appearance:none;
    width:14px; height:14px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,.85); background:transparent;
    flex-shrink:0; cursor:pointer; position:relative;
  }
  .rc-item input[type="checkbox"]:checked{ background:#fff; border-color:#fff; }
  .rc-item input[type="checkbox"]:checked::after{
    content:""; position:absolute; left:3.5px; top:1px; width:4px; height:7px;
    border:solid #2F4A3A; border-width:0 1.6px 1.6px 0; transform:rotate(40deg);
  }
  .rc-item span{flex:1;}
  .rc-item.checked span{text-decoration:line-through; opacity:.7;}
  .rc-item button{background:none; border:none; color:rgba(255,255,255,.7); font-size:13px; cursor:pointer; padding:0 2px; flex-shrink:0;}
  .rc-add-row{display:flex; gap:5px; margin-top:6px;}
  .rc-add-row input{flex:1; min-width:0; background:rgba(255,255,255,.18); border:none; border-radius:7px; color:#fff; font-size:10.5px; padding:5px 7px; font-family:var(--font-body);}
  .rc-add-row input::placeholder{color:rgba(255,255,255,.6);}
  .rc-add-row button{background:rgba(255,255,255,.28); border:none; border-radius:7px; color:#fff; width:22px; font-size:13px; cursor:pointer; flex-shrink:0;}

  .checkin-header{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px;}
  select#activitySelect{font-family:var(--font-body); font-size:13px; color:var(--ink-soft); background:var(--surface-soft); border:1px solid var(--border); border-radius:999px; padding:8px 10px; max-width:56%;}
  .new-wrap{position:relative; flex-shrink:0;}
  .new-popover{position:absolute; top:calc(100% + 8px); right:0; width:260px; max-width:80vw; background:var(--surface); border-radius:var(--radius-md); box-shadow:var(--shadow); padding:14px; display:none; z-index:20;}
  .new-popover.show{display:block;}
  .checkin-card{background:var(--surface); border-radius:var(--radius-lg); padding:20px; box-shadow:var(--shadow);}
  .checkin-title{font-family:var(--font-display); font-size:19px; font-weight:700;}
  .checkin-sub{color:var(--ink-soft); font-size:12.5px; margin-top:4px;}
  .progress-track{height:7px; background:var(--primary-tint); border-radius:99px; margin:16px 0 9px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--primary); border-radius:99px; transition:width .3s ease;}
  .progress-days{display:flex; gap:6px; margin-bottom:6px; flex-wrap:wrap;}
  .day-dot{flex:1; min-width:22px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; background:var(--surface-soft); color:var(--ink-soft); border:1px solid var(--border); cursor:pointer;}
  .day-dot.done{background:var(--primary-tint); color:var(--primary-deep); border-color:transparent;}
  .day-dot.current{background:var(--primary); color:#fff; border-color:transparent;}
  .day-dot.customized{box-shadow:inset 0 -3px 0 var(--accent);}
  .progress-hint{font-size:11px; color:var(--ink-soft); margin-bottom:14px;}
  .section-label{font-size:12px; color:var(--ink-soft); margin:16px 0 8px; letter-spacing:.02em;}
  .mood-options{display:flex; gap:8px; flex-wrap:wrap;}
  .mood-btn{border:1px solid var(--border); background:var(--surface-soft); border-radius:var(--radius-sm); padding:8px 12px; font-size:12.5px; cursor:pointer; color:var(--ink); display:flex; gap:6px; align-items:center;}
  .mood-btn.selected{background:var(--primary); color:#fff; border-color:transparent;}
  .task-item{display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px; cursor:pointer;}
  .task-item:last-child{border-bottom:none;}
  .task-item input{margin-top:3px; width:17px; height:17px; accent-color:var(--primary); cursor:pointer;}
  .task-item.done span{color:var(--ink-soft); text-decoration:line-through;}
  .task-tag{font-size:10.5px; padding:2px 7px; border-radius:6px; background:var(--success-tint); color:var(--success); flex-shrink:0; margin-top:1px;}
  .task-tag.side{background:var(--primary-tint); color:var(--primary-deep);}

  .field{margin-bottom:13px;}
  .field label{display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:5px;}
  .field input[type="text"], .field input[type="number"], .field input[type="date"]{
    width:100%; padding:10px 11px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:13.5px; font-family:var(--font-body);
  }
  .side-task-row{display:flex; gap:8px; margin-bottom:7px;}
  .side-task-row input{flex:1;}
  .side-task-row button{border:none; background:var(--surface-soft); border-radius:var(--radius-sm); width:34px; color:var(--accent); font-size:15px; cursor:pointer;}
  .add-side-btn{background:none; border:1px dashed var(--border); color:var(--ink-soft); border-radius:var(--radius-sm); padding:8px; width:100%; font-size:12.5px; cursor:pointer; margin-bottom:12px;}

  .cal-header{display:flex; align-items:center; justify-content:space-between; margin-top:2px;}
  .cal-header h2{font-family:var(--font-display); font-size:16px; margin:0;}
  .cal-nav{display:flex; gap:6px;}
  .cal-nav button{border:1px solid var(--border); background:var(--surface-soft); border-radius:8px; width:28px; height:28px; font-size:14px; cursor:pointer; color:var(--ink);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:10px;}
  .cal-dow{text-align:center; font-size:10.5px; color:var(--ink-soft); padding-bottom:4px;}
  .cal-cell{aspect-ratio:1; border-radius:9px; background:var(--surface); border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11.5px; cursor:pointer; gap:1px; overflow:hidden;}
  .cal-cell.blank{background:transparent; border:none; cursor:default;}
  .cal-cell.has-record{background:var(--primary-tint); border-color:transparent;}
  .cal-cell.today{outline:2px solid var(--primary); outline-offset:-2px;}
  .cal-cell .theme-mini{font-size:9px; font-weight:700; color:var(--primary-deep); line-height:1;}
  .theme-badges{display:flex; flex-direction:row; gap:2px;}
  .cal-detail{margin-top:14px; background:var(--surface); border-radius:var(--radius-md); padding:15px; box-shadow:var(--shadow); font-size:13px; display:none;}
  .cal-detail.show{display:block;}
  .cal-detail-block{margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--border);}
  .cal-detail-block:last-child{margin-bottom:0; padding-bottom:0; border-bottom:none;}
  .cal-detail-activity{font-weight:700; margin-bottom:8px;}
  .tl-row{display:flex; gap:10px; padding:5px 0; font-size:12.5px; align-items:flex-start;}
  .tl-time{color:var(--primary-deep); font-weight:700; flex-shrink:0; width:44px;}
  .tl-labels{color:var(--ink-soft);}
  .tl-labels-stack div{color:var(--ink-soft); padding:1px 0;}

  .activity-row{background:var(--surface); border-radius:var(--radius-md); padding:13px; margin-bottom:9px; display:flex; justify-content:space-between; align-items:center; gap:10px; box-shadow:var(--shadow); flex-wrap:wrap;}
  .activity-row .name{font-weight:600; font-size:13.5px;}
  .activity-row .meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .activity-row .actions{display:flex; gap:6px; flex-wrap:wrap;}
  hr.divider{border:none; border-top:1px solid var(--border); margin:20px 0;}

  .overlay{position:fixed; inset:0; background:rgba(20,25,20,.5); display:none; align-items:center; justify-content:center; padding:18px; z-index:60;}
  .overlay.show{display:flex;}
  .overlay-card{background:var(--surface); border-radius:var(--radius-lg); padding:20px; width:100%; max-width:420px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow);}
  .overlay-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px;}
  .overlay-head h3{font-family:var(--font-display); font-size:15.5px; margin:0;}
  .overlay-head button{border:none; background:none; font-size:20px; color:var(--ink-soft); cursor:pointer; line-height:1;}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="sidebar-drawer" id="sidebarDrawer">
    <div class="drawer-head"><span>🧪 實驗室</span><button id="closeDrawer">×</button></div>
    <div id="sidebarDrawerItems"></div>
  </div>

  <main class="main-area">
    <div class="top-row">
      <button class="rail-toggle" id="drawerToggle">≡</button>
      <span class="page-brand">🧪 實驗室</span>
    </div>

    <section id="view-routine" class="view"></section>

    <section id="view-checkin" class="view active">
      <div class="checkin-header">
        <select id="activitySelect"></select>
        <div class="new-wrap">
          <button class="btn secondary small" id="newActBtn">+ 新增</button>
          <div class="new-popover" id="newPopover">
            <div class="field"><label>活動名稱</label><input type="text" id="newName"></div>
            <div class="field"><label>總天數</label><input type="number" id="newDays" min="1" max="60" value="7"></div>
            <div class="field"><label>開始日期</label><input type="date" id="newStartDate"></div>
            <div class="field"><label>主線任務</label><input type="text" id="newMain"></div>
            <div id="sideTaskRows"></div>
            <button class="add-side-btn" id="addSideBtn">+ 新增支線任務</button>
            <button class="btn block" id="createBtn">建立並開始</button>
          </div>
        </div>
      </div>
      <div id="checkinBody"></div>
    </section>

    <section id="view-calendar" class="view"></section>
    <section id="view-archive" class="view"></section>
  </main>
</div>

<div class="overlay" id="dayOverlay">
  <div class="overlay-card">
    <div class="overlay-head"><h3 id="dayOverlayTitle">調整這一天</h3><button id="closeDayOverlay">×</button></div>
    <div class="field"><label>選擇日期(限活動天數範圍內,可任意跳選)</label><input type="date" id="dayDateInput"></div>
    <div class="section-label" style="margin-top:0;">場景</div>
    <div class="mood-options" id="dayMoodOptions"></div>
    <div class="section-label">主線 / 支線完成狀態(可直接補打卡)</div>
    <div class="task-list" id="dayTaskList"></div>
    <div class="section-label">調整任務文字(只影響這一天)</div>
    <div class="field"><label>主線任務</label><input type="text" id="dayMainInput"></div>
    <div id="daySideRows"></div>
    <button class="add-side-btn" id="dayAddSideBtn">+ 新增支線任務</button>
    <button class="btn block" id="daySaveTextBtn">儲存任務文字(僅這一天)</button>
  </div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="overlay-card" style="max-width:320px;">
    <div class="overlay-head"><h3>確定刪除?</h3><button id="closeConfirmOverlay">×</button></div>
    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 16px;">這個活動及其打卡記錄刪除後無法復原。</p>
    <div style="display:flex; gap:8px;">
      <button class="btn secondary block" id="cancelConfirmBtn">取消</button>
      <button class="btn block" id="confirmDeleteBtn" style="background:var(--accent);">確定刪除</button>
    </div>
  </div>
</div>

<div class="overlay" id="editStartOverlay">
  <div class="overlay-card" style="max-width:320px;">
    <div class="overlay-head"><h3>調整開始日期</h3><button id="closeEditStartOverlay">×</button></div>
    <div class="field"><label>開始日期</label><input type="date" id="editStartDateInput"></div>
    <button class="btn block" id="saveEditStartBtn">儲存</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "checkinLabData_v5";
  var MOODS = [
    {id:"sun", emoji:"☀️", label:"晴"}, {id:"cloud", emoji:"☁️", label:"陰"},
    {id:"rain", emoji:"🌧️", label:"暴雨"}, {id:"low", emoji:"🫠", label:"低迷"},
    {id:"dim", emoji:"🕯️", label:"微光"}, {id:"fire", emoji:"🔥", label:"燃起"}
  ];
  var QUAD_COLORS = ["var(--quad-1)","var(--quad-2)","var(--quad-3)","var(--quad-4)"];
  var NAV_ITEMS = [
    {tab:"routine", label:"日常"},
    {tab:"checkin", label:"打卡"},
    {tab:"calendar", label:"月曆"},
    {tab:"archive", label:"封存"}
  ];
  var currentTab = "checkin";

  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return {activities:[], activeId:null, records:{}, routine:null};
      var parsed = JSON.parse(raw);
      parsed.activities = parsed.activities || [];
      parsed.records = parsed.records || {};
      return parsed;
    }catch(e){ return {activities:[], activeId:null, records:{}, routine:null}; }
  }
  function saveData(d){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }catch(e){} }
  var data = loadData();

  function todayStr(){ return fmt(new Date()); }
  function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function addDays(dateStr, n){ var d=new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n); return fmt(d); }
  function diffDays(dateStr, startStr){
    var a=new Date(dateStr+"T00:00:00"), b=new Date(startStr+"T00:00:00");
    return Math.round((a-b)/86400000);
  }
  function uid(){ return Math.random().toString(36).slice(2,10); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
  }
  function themeChar(act){
    if(!act || !act.name) return "幕";
    var t = act.name.trim();
    return t ? t.charAt(0) : "幕";
  }
  function nowTimeStr(){
    var d = new Date();
    return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }

  function getActive(){ return data.activities.find(function(a){ return a.id===data.activeId; }) || null; }
  function currentDayIndex(act){
    if(!act) return 0;
    var idx = diffDays(todayStr(), act.startDate)+1;
    if(idx<1) idx=1; if(idx>act.totalDays) idx=act.totalDays;
    return idx;
  }
  function getTasksForDate(act, dateStr){
    var o = (act.taskOverrides||{})[dateStr];
    return o ? o : {mainTask:act.mainTask, sideTasks:act.sideTasks};
  }
  function ensureRecordShape(act, rec, dateStr){
    var tasks = getTasksForDate(act, dateStr);
    rec.sideDone = rec.sideDone || {};
    tasks.sideTasks.forEach(function(t){ if(!(t.id in rec.sideDone)) rec.sideDone[t.id] = null; });
    if(typeof rec.mood === "undefined") rec.mood = null;
    if(typeof rec.mainDone === "undefined") rec.mainDone = null;
    return rec;
  }
  function getRecord(act, dateStr){
    data.records[act.id] = data.records[act.id] || {};
    var rec = data.records[act.id][dateStr];
    if(!rec){ rec = {mood:null, mainDone:null, sideDone:{}}; data.records[act.id][dateStr] = rec; }
    ensureRecordShape(act, rec, dateStr);
    return rec;
  }
  function isDayComplete(act, rec, dateStr){
    var tasks = getTasksForDate(act, dateStr);
    if(!rec.mainDone) return false;
    for(var i=0;i<tasks.sideTasks.length;i++){ if(!rec.sideDone[tasks.sideTasks[i].id]) return false; }
    return true;
  }
  function effectiveMainDone(act, dateStr){
    var recsForAct = data.records[act.id] || {};
    var dates = Object.keys(recsForAct).filter(function(d){ return d <= dateStr; }).sort();
    for(var i=dates.length-1; i>=0; i--){
      var r = recsForAct[dates[i]];
      if(r && typeof r.mainDone !== "undefined" && r.mainDone !== null) return r.mainDone;
    }
    return null;
  }
  function effectiveSideDone(act, dateStr, taskId){
    var recsForAct = data.records[act.id] || {};
    var dates = Object.keys(recsForAct).filter(function(d){ return d <= dateStr; }).sort();
    for(var i=dates.length-1; i>=0; i--){
      var r = recsForAct[dates[i]];
      if(r && r.sideDone && typeof r.sideDone[taskId] !== "undefined" && r.sideDone[taskId] !== null) return r.sideDone[taskId];
    }
    return null;
  }
  function buildDayEntries(act, rec, dateStr){
    var tasks = getTasksForDate(act, dateStr);
    var raw = [];
    if(rec.mainDone) raw.push({time:rec.mainDone.at, label:tasks.mainTask});
    tasks.sideTasks.forEach(function(t){
      var sd = rec.sideDone[t.id];
      if(sd) raw.push({time:sd.at, label:"支線·"+t.text});
    });
    if(rec.mood){
      var m = MOODS.find(function(mm){ return mm.id===rec.mood.id; });
      raw.push({time:rec.mood.at, label:(m ? m.emoji+" "+m.label : "")});
    }
    var map = {};
    raw.forEach(function(r){ map[r.time]=map[r.time]||[]; map[r.time].push(r.label); });
    return Object.keys(map).sort().map(function(t){ return {time:t, labels:map[t]}; });
  }

  var calCursor = new Date();
  function visibleForCalendar(){ return data.activities.filter(function(a){ return !a.hiddenFromCalendar; }); }
  function renderCalendar(){
    var el = document.getElementById("view-calendar");
    var acts = visibleForCalendar();
    var year = calCursor.getFullYear(), month = calCursor.getMonth();
    var first = new Date(year, month, 1);
    var startOffset = (first.getDay()+6)%7;
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var dow = ["一","二","三","四","五","六","日"];

    var grid = dow.map(function(d){ return '<div class="cal-dow">'+d+'</div>'; }).join("");
    for(var i=0;i<startOffset;i++){ grid += '<div class="cal-cell blank"></div>'; }
    for(var day=1; day<=daysInMonth; day++){
      var dateStr = year+"-"+String(month+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
      var actsToday = acts.filter(function(a){ return data.records[a.id] && data.records[a.id][dateStr]; });
      var cls = "cal-cell";
      if(actsToday.length) cls += " has-record";
      if(dateStr === todayStr()) cls += " today";
      var badge = actsToday.length ? '<div class="theme-badges">'+actsToday.slice(0,2).map(function(a){ return '<span class="theme-mini">'+themeChar(a)+'</span>'; }).join("")+'</div>' : "";
      grid += '<div class="'+cls+'" data-date="'+dateStr+'">'+day+badge+'</div>';
    }

    el.innerHTML =
      (acts.length===0 ? '<div class="empty-state"><p>還沒有主題週記錄。先去「打卡」建立一個吧。</p></div>' : '') +
      '<div class="cal-header"><h2>'+year+' 年 '+(month+1)+' 月</h2>'+
      '<div class="cal-nav"><button id="calPrev">‹</button><button id="calNext">›</button></div></div>'+
      '<div class="cal-grid">'+grid+'</div>'+
      '<div class="cal-detail" id="calDetail"></div>';

    document.getElementById("calPrev").onclick = function(){ calCursor.setMonth(calCursor.getMonth()-1); renderCalendar(); };
    document.getElementById("calNext").onclick = function(){ calCursor.setMonth(calCursor.getMonth()+1); renderCalendar(); };
    el.querySelectorAll(".cal-cell[data-date]").forEach(function(cell){
      cell.onclick = function(){
        var d = cell.dataset.date;
        var detail = document.getElementById("calDetail");
        var blocksHtml = "";
        acts.forEach(function(a){
          var rec = data.records[a.id] && data.records[a.id][d];
          if(!rec) return;
          var recSafe = ensureRecordShape(a, rec, d);
          var dayIdx = diffDays(d, a.startDate)+1;
          var entries = buildDayEntries(a, recSafe, d);
          var entriesHtml = entries.length
            ? entries.map(function(e){
                var labelsHtml = e.labels.length>1
                  ? '<div class="tl-labels-stack">'+e.labels.map(function(l){ return '<div>'+l+'</div>'; }).join('')+'</div>'
                  : '<span class="tl-labels">'+e.labels[0]+'</span>';
                return '<div class="tl-row"><span class="tl-time">'+e.time+'</span>'+labelsHtml+'</div>';
              }).join("")
            : '<div class="tl-row"><span class="tl-labels" style="color:var(--ink-soft)">這天還沒有打勾記錄</span></div>';
          blocksHtml += '<div class="cal-detail-block"><div class="cal-detail-activity">'+themeChar(a)+' '+escapeHtml(a.name)+' · 第'+dayIdx+'天</div>'+entriesHtml+'</div>';
        });
        detail.innerHTML = blocksHtml || ('<strong>'+d+'</strong><br><span style="color:var(--ink-soft)">這天沒有任何主題週的打卡記錄。</span>');
        detail.classList.add("show");
      };
    });
  }

      b.onclick = function(){
        var a = data.activities.find(function(x){ return x.id===b.dataset.archive; });
        a.archived = true;
        if(data.activeId===a.id){ var next=data.activities.find(function(x){ return !x.archived; }); data.activeId = next?next.id:null; }
        saveData(data); renderAll();
      };
    });
    el.querySelectorAll("[data-restore]").forEach(function(b){
      b.onclick = function(){ var a=data.activities.find(function(x){ return x.id===b.dataset.restore; }); a.archived=false; saveData(data); renderAll(); };
    });
    el.querySelectorAll("[data-togglecal]").forEach(function(b){
      b.onclick = function(){ var a=data.activities.find(function(x){ return x.id===b.dataset.togglecal; }); a.hiddenFromCalendar=!a.hiddenFromCalendar; saveData(data); renderAll(); };
    });
    el.querySelectorAll("[data-del]").forEach(function(b){
      b.onclick = function(){ openConfirmDelete(b.dataset.del); };
    });
  }

  var pendingDeleteId = null;
  function openConfirmDelete(id){ pendingDeleteId = id; document.getElementById("confirmOverlay").classList.add("show"); }
  function closeConfirmDelete(){ document.getElementById("confirmOverlay").classList.remove("show"); pendingDeleteId = null; }
  document.getElementById("closeConfirmOverlay").onclick = closeConfirmDelete;
  document.getElementById("cancelConfirmBtn").onclick = closeConfirmDelete;
  document.getElementById("confirmDeleteBtn").onclick = function(){
    if(!pendingDeleteId) return;
    data.activities = data.activities.filter(function(a){ return a.id!==pendingDeleteId; });
    delete data.records[pendingDeleteId];
    if(data.activeId===pendingDeleteId){ var next=data.activities.find(function(x){ return !x.archived; }); data.activeId=next?next.id:null; }
    saveData(data);
    closeConfirmDelete();
    renderAll();
  };

  var editStartId = null;
  function openEditStart(id){
    editStartId = id;
    var a = data.activities.find(function(x){ return x.id===id; });
    document.getElementById("editStartDateInput").value = a.startDate;
    document.getElementById("editStartOverlay").classList.add("show");
  }
  function closeEditStart(){ document.getElementById("editStartOverlay").classList.remove("show"); editStartId = null; }
  document.getElementById("closeEditStartOverlay").onclick = closeEditStart;
  document.getElementById("saveEditStartBtn").onclick = function(){
    if(!editStartId) return;
    var v = document.getElementById("editStartDateInput").value;
    if(!v){ alert("請選擇日期。"); return; }
    var a = data.activities.find(function(x){ return x.id===editStartId; });
    a.startDate = v;
    saveData(data);
    closeEditStart();
    renderAll();
  };

  function renderAll(){
    renderNav();
    renderRoutine();
    renderCheckin();
    renderCalendar();
    renderArchive();
  }
  renderAll();
  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
